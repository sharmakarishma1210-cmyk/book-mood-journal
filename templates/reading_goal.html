<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reading Goal | Book Mood Journal</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="reading-goal-page">
      <div class="reading-goal-card">
        <a href="/" class="back-to-journal"> ⬅ Back to Journal </a>
        <!-- ICON -->
        <div class="goal-icon">🎯</div>

        <!-- HEADER -->
        <h1>{{ current_month_name }} Reading Goal</h1>

        {% if goal_target > 0 %}

        <p class="goal-description">
          You're aiming to read
          <strong>{{ goal_target }} books</strong>
          this month.
        </p>

        <!-- GOAL SUMMARY -->
        <div class="goal-summary">
          <span class="goal-number"> {{ goal_target }} </span>

          <span class="goal-label"> books </span>

          <span class="goal-subtext"> monthly target </span>
        </div>

        <!-- CHANGE GOAL -->

        <div class="goal-settings">
          <h3>Change your goal</h3>

          <form action="/reading-goal" method="POST" class="goal-update-form">
            <input
              type="number"
              id="target_books"
              name="target_books"
              min="1"
              value="{{ goal_target }}"
              required
            />

            <button type="submit" class="goal-update-btn">Update</button>
          </form>
        </div>

        <!-- REMOVE -->

        <form action="/reading-goal" method="POST" class="goal-remove-form">
          <input type="hidden" name="action" value="delete" />

          <button type="submit" class="goal-remove-btn">
            Remove reading goal
          </button>
        </form>

        {% else %}

        <!-- NO GOAL -->

        <p class="goal-description">
          Set a small reading goal for yourself this month.
        </p>

        <form action="/reading-goal" method="POST" class="goal-new-form">
          <label for="target_books"> Books to read </label>

          <div class="goal-new-input">
            <input
              type="number"
              id="target_books"
              name="target_books"
              min="1"
              placeholder="5"
              required
            />

            <button type="submit" class="goal-update-btn">Set Goal</button>
          </div>
        </form>

        {% endif %}
      </div>
    </div>
    <script>
      if (localStorage.getItem("theme") == "dark") {
        document.body.classList.add("dark-mode");
      }
    </script>
  </body>
</html>
